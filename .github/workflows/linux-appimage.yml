# Builds the Linux AppImage and attaches it to the GitHub release.
# The Windows installer is still built on the maintainer's PC (build_exe.bat) and attached by hand; when the release
# is published this workflow adds VerseForge-<version>-x86_64.AppImage (+ .zsync for AppImageUpdate/Gear Lever).
# "Run workflow" (manual) builds it for testing and keeps it as a downloadable artifact of the run.
name: Linux AppImage

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the AppImage to (empty: just build it)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  appimage:
    # the oldest supported Ubuntu: the AppImage runs on systems with the same or a newer glibc (2.35+)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries (bundled into the AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3 libnspr4 libxkbfile1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-util1 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libxkbcommon-x11-0 libegl1 libgl1 libfontconfig1 libdbus-1-3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libasound2 libxshmfence1 libgbm1 file desktop-file-utils

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "PySide6>=6.6" "pyinstaller>=6.0"

      - name: Tests
        run: python -m pytest tests -q

      - name: Build AppImage
        env:
          APPIMAGE_UPDATE_INFO: "1"
        run: packaging/linux/build_appimage.sh

      - name: Smoke test (starts the bundled server without a window)
        run: |
          APP=$(ls dist/VerseForge-*-x86_64.AppImage)
          "$APP" --appimage-extract >/dev/null
          QT_QPA_PLATFORM=offscreen timeout 60 squashfs-root/AppRun --self-test

      - uses: actions/upload-artifact@v4
        with:
          name: VerseForge-linux-AppImage
          path: |
            dist/VerseForge-*-x86_64.AppImage
            dist/VerseForge-*-x86_64.AppImage.zsync

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$TAG" dist/VerseForge-*-x86_64.AppImage dist/VerseForge-*-x86_64.AppImage.zsync --clobber
